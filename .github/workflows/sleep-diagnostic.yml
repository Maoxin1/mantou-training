name: Sleep diagnostic APK
on:
  push:
    branches: [feat/sleep-companion-phase1]
    paths: ['android-sleep/**', '.github/workflows/sleep-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle -p android-sleep :app:assembleDebug :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mantou-sleep-diagnostic
          path: android-sleep/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
